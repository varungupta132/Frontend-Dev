<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
    body {
        background: #f2f2f2;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        margin: 100px;
    }
    .container {
        width: 380px;
        background: white;
        padding: 20px;
        border: 2px solid #000;
        box-shadow: 0px 0px 15px rgba(202,18,18,0.9);
    }
    h2 {
        text-align: center;
    }
    label {
        font-size: 14px;
        padding: 10px 0 5px 0;
        display: block;
    }
    input, select {
        width: 90%;
        border: 1px solid #ccc;
        padding: 10px;
        margin: 8px 0 15px 0;
    }
    button {
        width: 100%;
        background: #5a199a;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        height: 32px;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Registration Form</h2>

    <form id="regForm">
        <label>Full Name</label>
        <input id="name" type="text" placeholder="Enter name">

        <label>Email</label>
        <input id="email" type="email" placeholder="Enter email">

        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">

        <label>Gender</label>
        <select id="gender">
            <option value="">Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Phone Number</label>
        <input id="phone" type="tel" placeholder="10 digit phone">

        <button type="submit">Register</button>
    </form>
</div>
<!-- <script src="jquery_method.js"></script> -->
<script src="xhr_method.js"></script>
<!-- <script src="fetch_method.js"></script> -->
<!-- <script src="axios_method.js"></script> -->



</body>
</html>
