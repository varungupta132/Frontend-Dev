<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Select Your Preferences</h1>
  <form>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="india" selected>India</option>
      <option value="usa">USA</option>
      <option value="uk">UK</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
      <option value="up" selected>Uttar Pradesh</option>
      <option value="maharashtra">Maharashtra</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
      <option value="mathura" selected>Mathura</option>
      <option value="delhi">Delhi</option>
    </select>
    <br><br>

    <label for="tourist">Favorite Tourist Place:</label>
    <select id="tourist" name="tourist">
      <option value="taj" selected>Taj Mahal</option>
      <option value="beach">Goa Beach</option>
    </select>
  </form>

  <p>You selected India → Uttar Pradesh → Mathura, Favorite Place: Taj Mahal.</p>
</body>
</html>
